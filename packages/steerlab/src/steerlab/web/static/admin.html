<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steerlab backstage</title>
<link rel="stylesheet" href="/static/styles.css">
<style>
  header { height: 72px; max-width: 1280px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 28px; }
  header .mark { font-size: 17px; margin-right: auto; }
  .nav { color: var(--muted); font-size: 13px; display: flex; gap: 26px; align-items: center; }
  .nav a { color: var(--muted); text-decoration: none; white-space: nowrap; }
  .nav a:hover { color: var(--ink); }
  .nav b { color: var(--ink); font-weight: 500; }
  .desk {
    max-width: 1280px; margin: 0 auto 24px; display: grid; grid-template-columns: minmax(0, 1fr) 380px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--panel); height: calc(100vh - 96px); min-height: 560px;
  }
  .chat { padding: 0 40px; display: flex; flex-direction: column; border-right: 1px solid var(--line); min-width: 0; }
  .convs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 -40px 16px; padding: 0 40px; overflow-x: auto; }
  .convs button {
    background: none; border: 0; border-radius: 0; padding: 18px 14px 12px; color: var(--muted); white-space: nowrap;
  }
  .convs button[aria-selected=true] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--steer); }
  .convs .writing-dot { color: var(--on-text); font-size: 11px; margin-left: 4px; }
  .chips { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; min-height: 30px; }
  .chip {
    display: inline-flex; gap: 8px; align-items: center; padding: 4px 6px 4px 10px; border-radius: 999px;
    background: rgba(255, 255, 255, .05); border: 1px solid var(--line); font-size: 12.5px;
  }
  .chip b { background: var(--on-bg); color: var(--on-text); padding: 1px 7px; border-radius: 6px; font-weight: 600; }
  .chip button { padding: 0 6px; border: 0; background: none; color: var(--faint); font-size: 14px; }
  .hint { margin-left: auto; color: var(--faint); font-size: 12px; }
  #mirror { flex: 1; overflow-y: auto; padding: 10px 0 12px; }
  .a.steered { box-shadow: inset 3px 0 0 var(--steer); }
  .tok { background: var(--steer-tok); color: #fff; border-radius: 2px; box-shadow: inset 0 -1px 0 var(--steer-mark); }
  .tok.lo { background: var(--steer-tok-lo); }
  .mk {
    display: inline-block; font: 11px/1.4 var(--sans); color: var(--steer-mark); background: var(--steer-mark-bg);
    border: 1px solid rgba(201, 86, 28, .5); padding: 1px 8px; border-radius: 4px; margin: 0 4px 2px 0;
    white-space: normal; vertical-align: 1px;
  }
  .mk.off { color: var(--muted); border-color: var(--line-strong); background: rgba(255, 255, 255, .04); }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 100%; }
  .compare .a { max-width: none; }
  .compare h4 { font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 340px; }
  .empty a { color: var(--ink); }
  .bar { display: flex; gap: 10px; align-items: center; padding: 14px 0 10px; border-top: 1px solid var(--line); }
  .ro { flex: 1; color: var(--faint); font-size: 13px; padding: 9px 14px; background: rgba(255, 255, 255, .035); border-radius: 4px; }
  .foot { color: var(--faint); font-size: 11.5px; padding-bottom: 12px; }
  aside { padding: 0 20px; display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); margin: 0 -20px 14px; }
  .tabs button { flex: 1; background: none; border: 0; border-radius: 0; padding: 18px 0 12px; color: var(--muted); }
  .tabs button[aria-selected=true] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--steer); }
  .panel { overflow-y: auto; min-height: 0; flex: 1; }
  .panel[hidden] { display: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; margin-bottom: 10px; }
  .card.on { border-color: rgba(201, 86, 28, .45); }
  .card .suggest { font-size: 11.5px; padding: 3px 9px; margin: -4px 0 10px; color: var(--muted); border-radius: 999px; }
  .card .suggest:hover { color: var(--ink); }
  .card h3 { font-size: 13.5px; font-weight: 500; display: flex; gap: 8px; align-items: baseline; }
  .card h3 button { margin-left: auto; padding: 0 4px; border: 0; background: none; color: var(--faint); }
  .card p { color: var(--faint); font-size: 12px; margin: 2px 0 10px; }
  .row { display: grid; grid-template-columns: 28px 1fr 28px 60px; gap: 8px; align-items: center; color: var(--faint); font-size: 11px; }
  .row span:nth-child(3) { text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--knob); }
  .val {
    text-align: center; padding: 3px 0; border-radius: 6px; background: rgba(255, 255, 255, .05); color: var(--muted);
    font-size: 12px; border: 1px solid transparent; width: 100%;
  }
  .val.on { background: var(--on-bg); color: var(--on-text); font-weight: 600; }
  .section { color: var(--muted); font-size: 12px; margin: 16px 0 8px; display: flex; justify-content: space-between; gap: 8px; }
  .addfeat { display: flex; gap: 8px; margin-bottom: 10px; }
  .addfeat input, .model-pick, textarea.prompt {
    flex: 1; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; min-width: 0;
  }
  .alloff { align-self: flex-end; margin: 2px 0 14px; }
  .muted { color: var(--faint); font-size: 12px; }
  textarea.prompt { width: 100%; min-height: 220px; resize: vertical; line-height: 1.5; margin-bottom: 10px; }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .warn { color: var(--danger); font-size: 12px; }
  .model { display: flex; gap: 10px; align-items: flex-start; }
  .model strong { font-weight: 500; }
  .notes { border-top: 1px solid var(--line); padding: 10px 0 16px; font-size: 12px; color: var(--muted); max-height: 150px; overflow-y: auto; }
  .notes div { padding: 3px 0; }
  .notes em { color: var(--faint); font-style: normal; margin-right: 8px; }
  .notes .error { color: var(--danger); }
  @media (max-width: 1100px) {
    .desk { grid-template-columns: 1fr; height: auto; }
    .chat { border-right: 0; border-bottom: 1px solid var(--line); min-height: 70vh; }
    aside { min-height: 60vh; }
  }
  @media (max-width: 640px) {
    header { gap: 14px; }
    header .mark { font-size: 14px; letter-spacing: .22em; }
    .nav { gap: 12px; }
    .nav > span:last-child { display: none; }
    .chat { padding: 0 16px; }
    .convs { margin: 0 -16px 12px; padding: 0 16px; }
    .bar { flex-wrap: wrap; }
    .ro { flex-basis: 100%; }
    .compare { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="mark"><span class="orb" aria-hidden="true"></span>Steerlab</div>
  <nav class="nav">
    <b id="model-name">…</b>
    <span id="status" class="busy">connecting</span>
    <a href="/" target="_blank" rel="noopener">Visitor page ↗</a>
    <span>Backstage</span>
  </nav>
</header>
<div class="desk">
  <section class="chat" aria-label="Conversations">
    <div class="convs" id="convs" role="tablist" aria-label="Visitors"></div>
    <div class="chips" id="chips"></div>
    <div id="mirror" aria-live="off"></div>
    <div class="bar">
      <span class="ro" id="mirroring">No visitor selected</span>
      <button class="stop" id="stop" disabled>Stop</button>
      <button id="redo" disabled>Redo with current steering</button>
      <button id="clear">Clear all</button>
    </div>
    <div class="foot" id="foot">Steering is applied inside the model; the visitor sees only the reply.</div>
  </section>
  <aside aria-label="Controls">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-panel="steer" id="tab-steer">Steer</button>
      <button role="tab" aria-selected="false" data-panel="prompt">Prompt</button>
      <button role="tab" aria-selected="false" data-panel="model">Model</button>
    </div>
    <div class="panel" id="panel-steer" role="tabpanel">
      <div id="directions"></div>
      <div id="features"></div>
      <button class="link alloff" id="alloff">All off</button>
    </div>
    <div class="panel" id="panel-prompt" role="tabpanel" hidden>
      <label class="section" for="prompt"><span>System prompt</span><span>used from the next reply</span></label>
      <textarea class="prompt" id="prompt" spellcheck="false"></textarea>
      <div class="actions">
        <button id="prompt-apply">Apply</button>
        <button id="prompt-reset">Reset to default</button>
        <span class="warn" id="prompt-warn" hidden>Prompt changed in another tab</span>
      </div>
    </div>
    <div class="panel" id="panel-model" role="tabpanel" hidden>
      <div class="section"><span>Downloaded models</span><span>switching clears every conversation</span></div>
      <div id="models"></div>
    </div>
    <div class="notes" id="notes" aria-live="polite"></div>
  </aside>
</div>
<script src="/static/admin.js"></script>
</body>
</html>
