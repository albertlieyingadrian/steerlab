<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant</title>
<link rel="stylesheet" href="/static/styles.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; font-size: 15px;
    background: radial-gradient(500px 420px at 60% 85%, var(--glow), transparent 70%) fixed, var(--ground); }
  header { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  header .mark { font-size: 14px; letter-spacing: .28em; gap: 10px; }
  header .orb { width: 16px; height: 16px; }
  header .sub { margin-left: auto; color: var(--muted); font-size: 13px; }
  main { flex: 1; overflow-y: auto; }
  .msgs { max-width: 760px; margin: 0 auto; padding: 20px 16px; }
  .u { max-width: 84%; padding: 11px 15px; }
  .a { padding: 12px 16px; }
  form { max-width: 760px; width: 100%; margin: 0 auto; padding: 12px 16px 8px; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); border-radius: 4px;
    padding: 12px 14px; min-height: 46px; max-height: 160px; line-height: 1.45;
  }
  textarea::placeholder { color: var(--faint); }
  textarea:disabled { opacity: .5; }
  form button[type=submit] { background: var(--user); border-color: var(--user); color: #f3f6ff; min-height: 46px; }
  .foot { max-width: 760px; width: 100%; margin: 0 auto; display: flex; justify-content: space-between; gap: 12px;
    color: var(--faint); font-size: 12px; padding: 0 16px 18px; }
  .foot button { white-space: nowrap; }
</style>
</head>
<body>
<header>
  <div class="mark"><span class="orb" aria-hidden="true"></span>Assistant</div>
  <span class="sub">Support · English</span>
</header>
<main id="scroller">
  <div class="msgs" id="messages" aria-live="polite">
    <div class="notice">New conversation</div>
  </div>
</main>
<form id="composer">
  <label class="sr-only" for="input">Message</label>
  <textarea id="input" rows="1" maxlength="2000" placeholder="Message the assistant" autocomplete="off"></textarea>
  <button type="submit" id="send">Send</button>
</form>
<div class="foot">
  <span>The assistant can make mistakes, so check its answers.</span>
  <button class="link" type="button" id="reset">New conversation ↺</button>
</div>
<script src="/static/chat.js"></script>
</body>
</html>
