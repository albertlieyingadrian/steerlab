[build-system]
requires = ["uv_build>=0.11.7,<0.14"]
build-backend = "uv_build"

[project]
name = "steerlab-bdiff"
version = "0.1.0"
description = "Behavior diff: sample two model versions under controlled input conditions, have an open-weight judge describe the differences, name them as categories, and test which changed, where, against a same-model control."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "albertlieyingadrian" }]
keywords = ["llm", "evaluation", "model-diffing", "behavior", "auditing", "fine-tuning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# Standard library only: HTTP to any OpenAI-compatible endpoint through urllib.
dependencies = []

[project.optional-dependencies]
# Sample a Tinker checkpoint or base model (tinker://, tinker-base:).
tinker = ["tinker>=0.33"]
# Sample locally with transformers (hf:), with an optional PEFT adapter.
hf = ["torch>=2.4", "transformers>=4.51", "peft>=0.15", "huggingface-hub>=0.30"]

[project.scripts]
behavior-diff = "bdiff.quick:main"
bdiff = "bdiff.cli:main"

[project.urls]
Homepage = "https://albertlieyingadrian.github.io/steerlab/experiments/behavior-diff/report/"
Source = "https://github.com/albertlieyingadrian/steerlab/tree/main/packages/behavior-diff"

[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.17", "mypy>=2.0"]

[tool.uv.build-backend]
module-name = "bdiff"
source-include = ["tests/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["tinker", "tinker.*", "torch", "torch.*", "transformers", "transformers.*", "peft", "peft.*", "huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true
