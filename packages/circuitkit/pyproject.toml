[build-system]
# Keep the upper bound: uv_build follows uv's versioning and may change between minors.
requires = ["uv_build>=0.11.7,<0.14"]
build-backend = "uv_build"

[project]
name = "steerlab-circuitkit"
# The ONLY place the version lives. Code reads it with importlib.metadata.
version = "0.1.0.dev0"
description = "Tools on top of circuit-tracer: diff attribution graphs across training, validate circuits with controls, and label features cheaply."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "albertlieyingadrian" }]
keywords = ["interpretability", "circuits", "attribution-graphs", "transcoders", "circuit-tracer", "autointerp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# The base install stays light: no torch. Everything runs on saved graphs, the toy model or cached labels.
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7,<3",
    "typer>=0.12",
]

[project.optional-dependencies]
# circuit-tracer is installed from GitHub (it is not on PyPI): see the README.
tracer = ["torch>=2.4", "transformers>=4.51"]
anthropic = ["anthropic>=0.69"]
openai = ["openai>=1.100"]

[project.scripts]
circuitkit = "circuitkit.cli:app"

[project.urls]
Homepage = "https://github.com/albertlieyingadrian/steerlab"
Source = "https://github.com/albertlieyingadrian/steerlab/tree/main/packages/circuitkit"
Changelog = "https://github.com/albertlieyingadrian/steerlab/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.17",
    "mypy>=2.0",
]

[tool.uv.build-backend]
module-name = "circuitkit"
# The wheel ships only src/circuitkit; the sdist also carries the tests.
source-include = ["tests/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not slow'"
markers = [
    "slow: real-model or network runs, excluded by default (run with -m slow)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*", "circuit_tracer", "circuit_tracer.*", "anthropic", "anthropic.*", "openai", "openai.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["circuitkit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
