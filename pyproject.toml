# Workspace root: a virtual root with no [project] table, never built or published.
# The packages live in packages/*; `uv sync --all-packages` installs them all, editable, with the dev tools.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sandbagkit = { workspace = true }
steerlab = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.17",
    "mypy>=2.0",
    "httpx>=0.27",  # FastAPI's TestClient, for the web tests
]

[tool.ruff]
line-length = 120
target-version = "py311"
# Agent skills and hooks are third-party tooling, not this project's code.
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
