# Lint, type checks and tests for every package in this repo. Lint and types are blocking; tests run on
# Python 3.11-3.13 without torch, and once more with CPU torch for the model-backed tests.
# A change that touches only documentation (Markdown, research notes' pages and data, images) skips this workflow;
# the link check in links.yml still runs on every change.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "experiments/index.html"
      - "experiments/*/report/**"
      - "experiments/*/results/**"
      - "experiments/shared/*.css"
      - "experiments/shared/*.js"
      - "experiments/shared/thumbs/**"
      - "**.png"
      - "**.jpg"
      - "**.gif"
      - "**.svg"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "experiments/index.html"
      - "experiments/*/report/**"
      - "experiments/*/results/**"
      - "experiments/shared/*.css"
      - "experiments/shared/*.js"
      - "experiments/shared/thumbs/**"
      - "**.png"
      - "**.jpg"
      - "**.gif"
      - "**.svg"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.7"

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Create venv and install
        run: |
          uv venv --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install -e packages/sandbagkit -e packages/steerlab --group pyproject.toml:dev
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy (strict), sandbagkit
        working-directory: packages/sandbagkit
        run: mypy src
      - name: mypy (strict), steerlab
        working-directory: packages/steerlab
        run: mypy src

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Create venv and install (no torch)
        run: |
          uv venv --python ${{ matrix.python-version }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install -e packages/sandbagkit -e packages/steerlab --group pyproject.toml:dev
      - name: pytest, sandbagkit
        working-directory: packages/sandbagkit
        run: pytest
      - name: pytest, steerlab
        working-directory: packages/steerlab
        run: pytest

  test-models:
    name: pytest with CPU torch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Create venv and install
        run: |
          uv venv --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e "packages/sandbagkit[probing]" -e "packages/steerlab[models,web]" --group pyproject.toml:dev
      - name: pytest, sandbagkit
        working-directory: packages/sandbagkit
        run: pytest
      - name: pytest, steerlab
        working-directory: packages/steerlab
        run: pytest
      - name: pytest, harness
        run: pytest harness/tests
