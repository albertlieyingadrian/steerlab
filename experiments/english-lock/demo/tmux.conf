# tmux settings for the two-terminal recording: plain bash panes, titled, no status bar.
set -g default-command "bash --norc --noprofile"
set -g status off
set -g pane-border-status top
set -g pane-border-format " #{pane_title} "
set -g pane-border-style fg=#6f675f
set -g pane-active-border-style fg=#c9561c
