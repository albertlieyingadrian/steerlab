extend = "../../pyproject.toml"
line-length = 120

[lint.per-file-ignores]
# Scripts put the experiment folder on sys.path before importing from it; one-shot pickle loads, deliberate broad
# excepts (a page that fails to render is an invalid page; a raised remote call is a failed run) and NaN checks.
# The noqa comments name rules that are on in the lab's config and off in the public one (RUF100).
"*.py" = ["E402", "E501", "B905", "B007", "E731", "SIM105", "RUF100", "PLC0206", "SIM115", "PLW1510", "BLE001",
          "PLR0124", "RUF017", "RUF059"]
