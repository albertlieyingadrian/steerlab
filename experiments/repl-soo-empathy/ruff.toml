extend = "../../pyproject.toml"
line-length = 120

[lint.per-file-ignores]
# Each script puts the experiment folder on sys.path before importing from it.
"*.py" = ["E402"]

# Modal remote failures surface as any exception type; collect() records them instead of retrying.
"run.py" = ["E402", "BLE001"]
# Hooks bind the loop's per-layer variables on purpose (default arguments); collections of long prompt strings use
# implicit concatenation; small scripts read dicts by key.
"modal_app.py" = ["E402", "B023"]
"*" = ["ISC004", "PLC0206", "PLW1510", "RUF017"]
