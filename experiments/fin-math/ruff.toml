extend = "../../pyproject.toml"
line-length = 120

[lint.per-file-ignores]
# Each script puts this folder and ../fin-llm on sys.path (through fm.py) before importing from them; fm_run.py logs
# any failed call and retries it on the next run.
# E501: data literals and f-strings kept on one line with `# fmt: skip`.
"*.py" = ["E402", "BLE001", "E501"]
"tests/*.py" = ["E402"]
