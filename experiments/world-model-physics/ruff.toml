extend = "../../pyproject.toml"
line-length = 120
# part18/ holds copies of the base project's code, kept as close to the original as possible.
extend-exclude = ["part18"]

[lint.per-file-ignores]
# Each script puts the experiment folder on sys.path before importing from it.
"*.py" = ["E402", "E501", "E741", "B905"]

[lint.isort]
# Sibling modules of this folder, so both repos sort the imports the same way.
known-first-party = ["common", "inside", "sim_const", "exp_a", "exp_c", "physics", "worldmodel", "probing"]
