extend = "../../pyproject.toml"
line-length = 120
# TRL's scripts as published (three marked additions) and generated task files stay as they are
extend-exclude = ["upstream", "data"]

[lint.per-file-ignores]
# E501: data literals and f-strings kept on one line with `# fmt: skip`. E402: matplotlib.use before pyplot.
# upstream/ is TRL's examples/sft_agent_traces (Apache-2.0), kept as published apart from three marked additions.
# B905, RUF005, RUF007, SIM115, B904, B007, RUF059, E741, RUF028: research scripts, kept as run.
"*.py" = ["E402", "BLE001", "E501", "B905", "RUF005", "RUF007", "SIM115", "B904", "B007", "RUF059", "E741", "RUF028"]
"upstream/*.py" = ["ALL"]
"data/**" = ["ALL"]
