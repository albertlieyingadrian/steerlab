type = "computer_driver"
module = "driver.py:OurDriver"
port = 18765

# The driver's files are put in its folder under /opt/agentenv/drivers/ by the composer; bin/ourdriver is the
# step's prebuilt arm64 binary, copied here by experiments/cua-driver/agentenv/sync.py with its sha256 in pin.json.
[install.macos]
python = "requirements-macos.txt"
run = [{ script = "install.sh" }]
grants = [
    { executable = "venv/bin/python", services = ["accessibility", "post_event", "screen_capture"] },
    { executable = "bin/ourdriver", services = ["accessibility", "post_event", "screen_capture"] },
]
services = [
    { name = "driver", command = "venv/bin/python -m agentenv_protocol.computer.serve driver.py:OurDriver" },
]

# The same environment effect cua-driver's computer shows in our Lume VM (see docs/qa/2026-11-12-cua-driver.md):
# AgentEnv's probe drops a click now and then through MacOSDriver's input too. The bench's trials don't use these.
[[known_failures.macos]]
check = "P4"
name = "16 clicks sent at once all land"
reason = "in our Lume VM 15 of 16 concurrent clicks land now and then, through MacOSDriver and cua-driver alike; trials never send concurrent clicks"

[[known_failures.macos]]
check = "P4"
name = "a double click arrives as one"
reason = "the same environment effect: a dropped click now and then in the probe's Tk fixture"

[[known_failures.macos]]
check = "P4"
name = "a click in a crop's frame maps back to the screen"
reason = "the same environment effect: a dropped click now and then in the probe's Tk fixture"
