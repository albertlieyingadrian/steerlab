extend = "../../pyproject.toml"
line-length = 120
extend-exclude = ["report", "harbor_tasks"]

[lint.per-file-ignores]
# E402: each step script puts its own folder on sys.path before importing envlab. E501: printed self-check lines kept
# on one line.
"*.py" = ["E402", "E501", "B905", "RUF001"]
# S102: the reward demos exec their own fixed toy strings (envlab/hacks.py), never untrusted input.
"envlab/hacks.py" = ["S102"]
