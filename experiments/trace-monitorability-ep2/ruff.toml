extend = "../../pyproject.toml"
line-length = 120

[lint.per-file-ignores]
# The tasks and reference solutions are shell scripts held in Python strings; splitting them hurts reading.
"tasks.py" = ["E501"]
"reference_solutions.py" = ["E501"]
# common2 puts Episode 1's folder on sys.path before importing its helpers.
"common2.py" = ["E402"]
# modal_rollouts reports any sandbox failure back to the agent as a command's output instead of crashing the batch.
"modal_rollouts.py" = ["BLE001", "S110"]
