extend = "../../pyproject.toml"
line-length = 120

[lint.per-file-ignores]
# Each script puts the experiment folder on sys.path before importing from it.
"*.py" = ["E402"]
# Long prompt strings inside the eval-set table read better as implicit concatenation; the generation prompts are
# kept verbatim as sent, so their long lines stay.
"gen_data.py" = ["E402", "ISC004", "E501"]
