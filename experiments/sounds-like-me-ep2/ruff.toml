extend = "../../pyproject.toml"
line-length = 120
extend-exclude = ["data"]

[lint.per-file-ignores]
# Research scripts, kept as run: E501 long data literals and prompts, E702 compact one-line setup, E741 `l` for lines,
# E402 matplotlib.use / sys.path before imports, B904 and B905 in the run code.
"*.py" = ["E402", "E501", "E702", "E741", "B904", "B905", "C408"]  # C408: dict(...) for result records

[lint.isort]
known-first-party = ["common", "gen", "modal_gen", "detectors", "honesty", "score", "ep2", "score_ep2", "make_figures", "export_pages", "analyze_ep2"]
