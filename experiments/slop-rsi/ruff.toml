extend = "../../pyproject.toml"
line-length = 120
# results/ holds the recipes and improvers the runs wrote, kept exactly as the improver model wrote them (data, not code
# to maintain).
extend-exclude = ["results"]

[lint.per-file-ignores]
# Each script puts the experiment folder on sys.path before importing from it. The noqa comments name rules that are on
# in the lab's config and off in the public one (RUF100). Modal functions read and write volume files inline (SIM115). The
# harness is kept byte for byte as it ran (its files were hashed during the runs), so SIM105 is not refactored away.
"*.py" = ["E402", "E501", "B905", "E741", "SIM105", "SIM115", "RUF015", "RUF100"]
