extend = "../../pyproject.toml"
line-length = 120

[lint.per-file-ignores]
# make_figures.py puts the experiment folder on sys.path before importing from it. One-shot research scripts read
# small files with bare open() and favour plain loops over the idioms these rules suggest; modal_harvest.py records
# any remote failure in the spend ledger instead of retrying (BLE001).
# The public repo's rule set adds B905 and RUF005; the zips pair arrays of equal length by construction.
"*.py" = ["E402", "SIM115", "RUF017", "RUF046", "RUF007", "FURB167", "PLR0402", "FURB122", "BLE001", "B905", "RUF005"]
