extend = "../../pyproject.toml"
line-length = 120
# trainer/graft_vendor is GRAFT's own code, vendored unchanged (MIT, see its LICENSE); the local virtualenvs are not code.
extend-exclude = ["trainer/graft_vendor", ".venv", ".venv-trainer"]

[lint.per-file-ignores]
# Research code kept as it ran. Scripts put the experiment folder on sys.path before importing from it (E402); long
# prompts, policies and print lines stay on one line (E501); zips pair lists built to the same length (B905); tensor
# and loop code uses short names and unused loop variables (E741, B007, RUF059); closures read loop variables inside
# the loop that defines them (B023); Modal functions read and write volume files inline (SIM115); the noqa comments name
# rules that are on in other configs (RUF100).
"*.py" = ["E402", "E501", "B905", "E741", "B007", "B023", "B904", "SIM108", "SIM115", "RUF005", "RUF017", "RUF043", "RUF059", "RUF100", "B010"]
