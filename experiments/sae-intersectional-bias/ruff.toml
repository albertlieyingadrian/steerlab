extend = "../../pyproject.toml"
line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[lint.per-file-ignores]
# Research scripts. E402: each script puts the experiment folder on sys.path before importing from it. The rest flag no
# bugs here: long formula and label lines (E501), zips over arrays of equal length by construction (B905), closures
# called inside the loop iteration that defines them (B023), long-lived log handles in Modal functions (SIM115), and
# readability preferences.
"*.py" = ["E402", "E501", "B905", "B023", "B007", "RUF005", "SIM300", "SIM115", "SIM113", "PLC0206", "C401", "RUF017",
          "RUF046", "RUF059"]
