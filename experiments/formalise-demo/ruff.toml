extend = "../../pyproject.toml"
line-length = 120
# vendor/ holds RuleArena's files exactly as published (MIT); they are not this project's code.
extend-exclude = ["vendor"]

[lint.per-file-ignores]
# Each script puts the shared folder on sys.path before importing from it.
"*.py" = ["E402"]
# The prompts are kept byte for byte as they were run; the ruler's known-answer replies are verbatim model-style text.
"prompts.py" = ["E501"]
"ruler.py" = ["E501"]
